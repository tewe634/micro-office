<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 34px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f1f1f; }
      .subtitle { font: 400 16px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #595959; }
      .section-title { font: 700 22px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f1f1f; }
      .box-title { font: 700 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f1f1f; }
      .box-text { font: 400 15px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #262626; }
      .small-text { font: 400 14px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #595959; }
      .note-title { font: 700 17px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #cf1322; }
      .note-text { font: 400 15px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #5c0011; }
      .shadow { filter: drop-shadow(0px 8px 20px rgba(0,0,0,0.08)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c8c8c"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <text x="70" y="70" class="title">micro-office 产品数据架构图（老版本三级分类口径）</text>
  <text x="70" y="102" class="subtitle">汇报版 / 横向结构视图 / 按 category_level1~3 展示</text>

  <text x="90" y="165" class="section-title">数据进入</text>
  <text x="390" y="165" class="section-title">产品主数据中心</text>
  <text x="980" y="165" class="section-title">三级分类口径</text>
  <text x="1280" y="165" class="section-title">下游应用</text>

  <!-- 数据进入 -->
  <g class="shadow">
    <rect x="70" y="190" rx="20" ry="20" width="240" height="430" fill="#eaf4ff" stroke="#5b8ff9" stroke-width="2"/>

    <rect x="95" y="225" rx="14" ry="14" width="190" height="90" fill="#ffffff" stroke="#91caff"/>
    <text x="190" y="262" text-anchor="middle" class="box-title">Excel 导入</text>
    <text x="190" y="288" text-anchor="middle" class="box-text">历史产品资料</text>

    <rect x="95" y="350" rx="14" ry="14" width="190" height="90" fill="#ffffff" stroke="#91caff"/>
    <text x="190" y="387" text-anchor="middle" class="box-title">导入脚本</text>
    <text x="190" y="413" text-anchor="middle" class="box-text">批量清洗 / 导入</text>

    <rect x="95" y="475" rx="14" ry="14" width="190" height="110" fill="#ffffff" stroke="#91caff"/>
    <text x="190" y="512" text-anchor="middle" class="box-title">产品维护页</text>
    <text x="190" y="538" text-anchor="middle" class="box-text">ProductPage</text>
    <text x="190" y="562" text-anchor="middle" class="small-text">人工维护产品主数据</text>
  </g>

  <!-- 主数据中心 -->
  <g class="shadow">
    <rect x="350" y="190" rx="22" ry="22" width="560" height="430" fill="#eef9f1" stroke="#52c41a" stroke-width="2.5"/>

    <ellipse cx="630" cy="250" rx="138" ry="38" fill="#ffffff" stroke="#95de64" stroke-width="2"/>
    <text x="630" y="257" text-anchor="middle" class="box-title">product 主表</text>

    <rect x="390" y="310" rx="12" ry="12" width="230" height="95" fill="#ffffff" stroke="#b7eb8f"/>
    <text x="505" y="342" text-anchor="middle" class="box-title">基础属性</text>
    <text x="505" y="370" text-anchor="middle" class="box-text">id / code / name</text>
    <text x="505" y="392" text-anchor="middle" class="box-text">spec / price / org_id</text>

    <rect x="640" y="310" rx="12" ry="12" width="230" height="95" fill="#ffffff" stroke="#b7eb8f"/>
    <text x="755" y="342" text-anchor="middle" class="box-title">父子结构</text>
    <text x="755" y="375" text-anchor="middle" class="box-text">parent_id → product.id</text>

    <rect x="390" y="430" rx="12" ry="12" width="230" height="120" fill="#ffffff" stroke="#b7eb8f"/>
    <text x="505" y="462" text-anchor="middle" class="box-title">物料类别</text>
    <text x="505" y="494" text-anchor="middle" class="box-text">category_code</text>
    <text x="505" y="520" text-anchor="middle" class="small-text">原始物料类别编码</text>

    <rect x="640" y="430" rx="12" ry="12" width="230" height="120" fill="#ffffff" stroke="#b7eb8f"/>
    <text x="755" y="462" text-anchor="middle" class="box-title">三级分类字段</text>
    <text x="755" y="490" text-anchor="middle" class="box-text">category_level1</text>
    <text x="755" y="514" text-anchor="middle" class="box-text">category_level2 / category_level3</text>

    <rect x="390" y="570" rx="12" ry="12" width="480" height="50" fill="#ffffff" stroke="#b7eb8f"/>
    <text x="630" y="602" text-anchor="middle" class="box-title">老版本分类字段直接存储在 product 表内</text>
  </g>

  <!-- 三级分类口径 -->
  <g class="shadow">
    <rect x="960" y="190" rx="20" ry="20" width="260" height="430" fill="#fff7e6" stroke="#fa8c16" stroke-width="2"/>

    <rect x="995" y="215" rx="14" ry="14" width="190" height="60" fill="#ffffff" stroke="#ffd591"/>
    <text x="1090" y="252" text-anchor="middle" class="box-title">物料类别</text>
    <text x="1090" y="272" text-anchor="middle" class="small-text">category_code</text>

    <line x1="1090" y1="276" x2="1090" y2="305" stroke="#fa8c16" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="995" y="310" rx="14" ry="14" width="190" height="60" fill="#ffffff" stroke="#ffd591"/>
    <text x="1090" y="347" text-anchor="middle" class="box-title">一级分类</text>
    <text x="1090" y="367" text-anchor="middle" class="small-text">category_level1</text>

    <line x1="1090" y1="371" x2="1090" y2="400" stroke="#fa8c16" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="995" y="405" rx="14" ry="14" width="190" height="60" fill="#ffffff" stroke="#ffd591"/>
    <text x="1090" y="442" text-anchor="middle" class="box-title">二级分类</text>
    <text x="1090" y="462" text-anchor="middle" class="small-text">category_level2</text>

    <line x1="1090" y1="466" x2="1090" y2="495" stroke="#fa8c16" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="995" y="500" rx="14" ry="14" width="190" height="60" fill="#ffffff" stroke="#ffd591"/>
    <text x="1090" y="537" text-anchor="middle" class="box-title">三级分类</text>
    <text x="1090" y="557" text-anchor="middle" class="small-text">category_level3</text>

    <line x1="1090" y1="561" x2="1090" y2="590" stroke="#fa8c16" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="995" y="595" rx="14" ry="14" width="190" height="60" fill="#ffffff" stroke="#ffd591"/>
    <text x="1090" y="632" text-anchor="middle" class="box-title">物料 SKU</text>
    <text x="1090" y="652" text-anchor="middle" class="small-text">code + name + spec</text>
  </g>

  <!-- 下游应用 -->
  <g class="shadow">
    <rect x="1250" y="190" rx="20" ry="20" width="280" height="430" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/>

    <rect x="1280" y="225" rx="14" ry="14" width="220" height="88" fill="#ffffff" stroke="#d3adf7"/>
    <text x="1390" y="257" text-anchor="middle" class="box-title">产品台账 / 查询</text>
    <text x="1390" y="284" text-anchor="middle" class="box-text">/api/products</text>

    <rect x="1280" y="350" rx="14" ry="14" width="220" height="88" fill="#ffffff" stroke="#d3adf7"/>
    <text x="1390" y="382" text-anchor="middle" class="box-title">产品门户</text>
    <text x="1390" y="409" text-anchor="middle" class="box-text">/api/portal/products/{id}</text>

    <rect x="1280" y="475" rx="14" ry="14" width="220" height="110" fill="#ffffff" stroke="#d3adf7"/>
    <text x="1390" y="507" text-anchor="middle" class="box-title">经营分析视图</text>
    <text x="1390" y="535" text-anchor="middle" class="box-text">销售 / 客户 / 部门</text>
    <text x="1390" y="559" text-anchor="middle" class="small-text">围绕产品主数据展开分析</text>
  </g>

  <!-- 连接箭头 -->
  <line x1="310" y1="405" x2="350" y2="405" stroke="#8c8c8c" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="910" y1="405" x2="960" y2="405" stroke="#8c8c8c" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1220" y1="405" x2="1250" y2="405" stroke="#8c8c8c" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 底部汇报重点 -->
  <g class="shadow">
    <rect x="70" y="680" rx="18" ry="18" width="1460" height="145" fill="#fff1f0" stroke="#ff7875" stroke-width="2"/>
    <text x="100" y="723" class="note-title">汇报重点</text>
    <text x="100" y="758" class="note-text">1. 老版本产品分类采用三级分类口径：category_level1 / category_level2 / category_level3</text>
    <text x="100" y="790" class="note-text">2. 物料类别 category_code 与三级分类共同构成产品分类体系，分类字段直接存储在 product 表中</text>
    <text x="100" y="822" class="note-text">3. 产品台账、产品门户和经营分析均围绕 product 主数据统一展开</text>
  </g>
</svg>
